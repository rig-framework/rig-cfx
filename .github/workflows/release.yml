name: Package Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean Release
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          TAG_NAME="${{ github.event.release.tag_name }}"

          CLEAN_NAME=$(echo "$REPO_NAME" | sed 's/-cfx$//')

          ZIP_NAME="${CLEAN_NAME}-${TAG_NAME}.zip"

          echo "Clean Name: $CLEAN_NAME"
          echo "Output Zip: $ZIP_NAME"

          mkdir -p build_dir/$CLEAN_NAME
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build_dir' \
            ./ build_dir/$CLEAN_NAME/

          cd build_dir
          zip -r "../$ZIP_NAME" "$CLEAN_NAME"
          cd ..

          echo "ZIP_FILE=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Zip to Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.ZIP_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}